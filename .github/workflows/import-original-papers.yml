name: Import original Mathieu papers

on:
  push:
    paths:
      - .github/workflows/import-original-papers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-primary-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mathieu
        uses: actions/checkout@v4
      - name: Download complete primary-source scans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p papers
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 240 \
            'https://www.numdam.org/item/JMPA_1861_2_6__241_0.pdf' \
            --output 'papers/Mathieu-1861-Memoire.pdf'
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 240 \
            'https://www.numdam.org/item/JMPA_1873_2_18__25_0.pdf' \
            --output 'papers/Mathieu-1873-Fonction-cinq-fois-transitive-24.pdf'
          python3 -c 'from pathlib import Path; files=list(Path("papers").glob("*.pdf")); assert len(files)==2; [(print(f"{p}: {p.stat().st_size} bytes"), (_ for _ in ()).throw(ValueError(f"Invalid PDF: {p}")) if p.stat().st_size < 5000 or p.read_bytes()[:5] != b"%PDF-" else None) for p in files]'
          sha256sum papers/*.pdf > papers/SHA256SUMS
      - name: Commit source scans, unmodified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/
          if ! git diff --cached --quiet; then
            git commit -m 'Add original Mathieu 1861 and 1873 scanned papers'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
