name: Verify original Mathieu papers and source indexes

on:
  push:
    paths:
      - 'papers/**'
      - 'README.md'
      - '.github/workflows/import-original-papers.yml'
  pull_request:
    paths:
      - 'papers/**'
      - 'README.md'
      - '.github/workflows/import-original-papers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the qualified Ithon host frontend
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .ithon
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ithon
            /ithon_host.py
            /Lib/ithon_frontend.py
            /Lib/ithon_static.py
            /Lib/ithon_run.py
          persist-credentials: false
      - name: Check archive integrity and refusals through Ithon
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/mathieu-archive-ithon.jsonl
        run: ./.ithon/ithon papers/test_verify.pi
